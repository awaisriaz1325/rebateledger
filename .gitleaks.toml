# Secret scanning config: default rules plus a narrow allowlist for files that hold
# deliberately fake, non-production keys (examples and the test harness).
[extend]
useDefault = true

[[allowlists]]
description = "Dummy keys in example env files and the test harness"
paths = [
  '''(^|/)\.env\.example$''',
  '''^backend/tests/conftest\.py$''',
]

[[allowlists]]
description = "RFC 6238 Appendix B public test-vector key used by the TOTP helper's unit test"
paths = [
  '''^frontend/e2e/fixtures/totp\.test\.ts$''',
]
