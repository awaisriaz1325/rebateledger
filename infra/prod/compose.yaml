# Production stack on the VM opspilot-production (ADR 0020, which revises ADR 0018).
# Started by infra/prod/deploy.sh, run on the devbox (see docs/runbooks/deploy.md).
# Separate project name, volumes and network from the dev stack (docker-compose.yml).
# Memory caps (mem_limit) keep RebateLedger from starving OpsPilot and imageme on the same VM.
name: rebateledger-prod

x-logs: &logs
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

# Container hardening (audit 2026-11-18): no Linux capabilities, no privilege gain via setuid,
# read-only root filesystem (only /tmp and the storage volume are writable).
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-app: &app
  <<: *hardened
  image: rebateledger-api:${RELEASE:?set RELEASE (git tag)}
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=256m"]
  # /var survives reboots on Container-Optimized OS; /etc does not (UNVERIFIED, ADR 0020).
  env_file: ${RL_ENV_FILE:-/var/lib/rebateledger/prod.env}
  environment:
    RL_ENV: production
    RL_STORAGE_DIR: /data/storage
    XDG_CACHE_HOME: /tmp/.cache  # fontconfig cache for PDFs (root filesystem is read-only)
  volumes: [storage:/data/storage]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  networks: [prod]
  logging: *logs

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      RL_OWNER_PASSWORD: ${RL_OWNER_PASSWORD:?}
      RL_APP_PASSWORD: ${RL_APP_PASSWORD:?}
    # WAL archiving for point-in-time recovery (RPO <= 5 min, ADR 0016): every finished WAL
    # segment (at least every 60 s) is copied to /archive, which `offsite` syncs to GCS.
    # The archive volume starts root-owned; without this chown every archive attempt fails
    # (found by the 2026-11-20 restore drill). Then the image's normal entrypoint runs.
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /archive/wal && chown postgres:postgres /archive/wal && exec docker-entrypoint.sh "$$@"
      - --
    command: >
      postgres -c wal_level=replica -c archive_mode=on -c archive_timeout=60
      -c "archive_command=test ! -f /archive/wal/%f && cp %p /archive/wal/%f"
    volumes:
      - pgdata:/var/lib/postgresql
      - archive:/archive
      # Mounted file by file: a file mount inside a read-only directory mount cannot be created.
      - ../postgres/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./postgres-init/02-replication.sh:/docker-entrypoint-initdb.d/02-replication.sh:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rebateledger"]
      interval: 10s
      timeout: 3s
      retries: 30
    networks: [prod]
    logging: *logs

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    # Password required even inside the private network (shared VM, audit 2026-11-18).
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment: {REDISCLI_AUTH: "${REDIS_PASSWORD:?}"}
    volumes: [redisdata:/data]
    mem_limit: 128m
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 30}
    networks: [prod]
    logging: *logs

  api:
    <<: *app
    environment:
      RL_ENV: production
      RL_STORAGE_DIR: /data/storage
      XDG_CACHE_HOME: /tmp/.cache
      FORWARDED_ALLOW_IPS: 172.31.250.0/24  # only the stack network (web) may set X-Forwarded-For
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["dramatiq", "app.workers.broker", "app.services.registry", "--processes", "1", "--threads", "4"]
    mem_limit: 768m  # PDF rendering and large imports

  scheduler:
    <<: *app
    command: ["python", "-m", "app.workers.scheduler"]
    mem_limit: 256m

  web:
    <<: *hardened
    image: rebateledger-web:${RELEASE:?}
    restart: unless-stopped
    # Verified 2026-11-20: the image serves pages read-only, as uid 1000, with no capabilities.
    read_only: true
    tmpfs: ["/tmp:size=64m", "/app/.next/cache:size=128m,uid=1000,gid=1000"]
    mem_limit: 512m
    # No host port. OpsPilot's nginx (ports 80/443 on the VM) reaches this container on its
    # network by the alias below; see infra/prod/nginx/.
    depends_on: [api]
    networks:
      prod: {}
      edge: {aliases: [rebateledger-web]}
    logging: *logs

  # Nightly base backup into /archive/base; base backup + WAL = point-in-time restore.
  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment: {PGPASSWORD: "${POSTGRES_PASSWORD:?}"}
    volumes: [archive:/archive]
    entrypoint: ["/bin/sh", "/backup.sh"]
    configs: [{source: backup_script, target: /backup.sh}]
    mem_limit: 256m
    depends_on: {postgres: {condition: service_healthy}}
    networks: [prod]
    logging: *logs

  # Copies WAL, base backups and uploaded files to the private GCS bucket every minute.
  # Auth: the VM's service account via the metadata server; it needs write on this bucket only.
  offsite:
    image: ${CLOUD_CLI_IMAGE:?pin an exact google-cloud-cli image tag, verified on the official registry}
    restart: unless-stopped
    environment: {BACKUP_BUCKET: "${BACKUP_BUCKET:?}"}
    volumes: ["archive:/archive:ro", "storage:/data/storage:ro"]
    entrypoint: ["/bin/sh", "/offsite.sh"]
    configs: [{source: offsite_script, target: /offsite.sh}]
    mem_limit: 512m
    networks: [prod]
    logging: *logs

configs:
  backup_script: {file: ./backup.sh}
  offsite_script: {file: ./offsite.sh}

networks:
  prod:
    ipam: {config: [{subnet: 172.31.250.0/24}]}
  # OpsPilot's compose network, where its nginx runs (imageme joins it the same way).
  edge:
    external: true
    name: ${RL_EDGE_NETWORK:-opspilot-clinic-frontdesk_default}

volumes: {pgdata: {}, redisdata: {}, storage: {}, archive: {}}
