# rebateledger.imagenet.tech, served by OpsPilot's nginx container on opspilot-production
# (ADR 0020). Copy to ~/nginx-extra/ on the VM; that nginx includes /etc/nginx/extra/*.conf.
# Stage 1: plain HTTP, enough for certbot's HTTP-01 challenge; everything else goes to HTTPS.
server {
  listen 80;
  server_name rebateledger.imagenet.tech;
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://rebateledger.imagenet.tech$request_uri;
  }
}
