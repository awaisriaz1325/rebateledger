# rebateledger.imageme.tech over HTTPS (ADR 0020). Stage 2: copy to ~/nginx-extra/ ONLY once
# /etc/letsencrypt/live/rebateledger.imageme.tech/ exists (OpsPilot's ./letsencrypt on the
# VM), or nginx, and OpsPilot and imageme with it, will not start. OpsPilot's certbot
# container renews the certificate; its nginx reloads every 6 h.
server {
  listen 443 ssl;
  http2 on;
  server_name rebateledger.imageme.tech;

  ssl_certificate /etc/letsencrypt/live/rebateledger.imageme.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rebateledger.imageme.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  # Mozilla "intermediate", the same suites as OpsPilot's own server block.
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;

  # Security headers (CSP with nonces, HSTS, frame denial) come from the app (frontend/proxy.ts,
  # backend middleware); adding them here would duplicate them.

  # Resolve the app per request through Docker's DNS, so nginx still starts (and OpsPilot keeps
  # working) when RebateLedger is down. The alias is set in infra/prod/compose.yaml.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $rebateledger http://rebateledger-web:3000;

  # Imports are capped at 50 MB by the API; leave room for the multipart envelope.
  client_max_body_size 55m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  location / {
    proxy_pass $rebateledger;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replaces any client-sent value: the app trusts this header (rate limits, lockout, ops
    # IP allowlist).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
