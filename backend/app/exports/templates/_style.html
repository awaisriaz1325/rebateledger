<style>
  @page { size: Letter landscape; margin: 14mm 12mm 16mm;
    @bottom-left { content: "{{ organization }} · {{ product }}"; font: 7.5pt sans-serif; color: #5b6660; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 7.5pt sans-serif; color: #5b6660; } }
  * { box-sizing: border-box; }
  body { font-family: "IBM Plex Sans", "DejaVu Sans", Arial, sans-serif; font-size: 8.5pt; color: #17201b; }
  h1 { font-size: 15pt; margin: 0 0 2mm; }
  h2 { font-size: 10.5pt; margin: 6mm 0 2mm; border-bottom: 1px solid #c9d1cc; padding-bottom: 1mm; }
  .muted { color: #5b6660; }
  .meta { margin: 0 0 4mm; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 7.5pt; text-transform: uppercase; color: #5b6660; border-bottom: 1px solid #9aa5a0; padding: 1.2mm 1.5mm; }
  td { border-bottom: 0.5pt solid #e1e6e3; padding: 1.1mm 1.5mm; vertical-align: top; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.total td { font-weight: 600; border-top: 1px solid #17201b; border-bottom: none; }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; }
  dl.kv { display: grid; grid-template-columns: 45mm 1fr; gap: 1mm 4mm; margin: 0; }
  dl.kv dt { color: #5b6660; } dl.kv dd { margin: 0; }
  .box { border: 1px solid #c9d1cc; border-radius: 2mm; padding: 3mm 4mm; margin: 2mm 0; }
  .ok { color: #1d6b3f; } .warn { color: #8a5a00; }
</style>
