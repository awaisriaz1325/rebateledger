[project]
name = "rebateledger-backend"
version = "0.1.0"
description = "RebateLedger API, worker, rebate engine and pilot CLI"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "redis",
  "dramatiq[redis]",
  "argon2-cffi",
  "pyotp",
  "cryptography",
  "pyyaml",
  "openpyxl",
  "defusedxml",
  "jinja2",
  "python-multipart",
  "structlog",
  "httpx",
  "qrcode",
  "weasyprint",
]

[project.scripts]
rebateledger = "app.cli:main"

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "hypothesis",
  "types-pyyaml",
  "bandit",
  "pip-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "N", "PT", "DTZ", "T20"]
# E501: line length is owned by `ruff format`; long literal strings (SQL-free templates,
# user-facing messages) are allowed.
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "PT018"]
"scripts/**" = ["S311", "T201"]
"app/**" = ["PT018"]  # asserts in app code narrow types after validation
"app/cli.py" = ["T201"]
"app/pilot/**" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["dramatiq.*", "pyotp.*", "qrcode.*", "weasyprint.*", "openpyxl.*", "defusedxml.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = ["db: needs a running Postgres", "slow: long running"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
