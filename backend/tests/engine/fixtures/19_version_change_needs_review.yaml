# HAND CALCULATION — SPEC §9 case 5: v1 ends 2026-02-15, v2 starts 2026-02-16 inside Q1
#   The engine must not pick a version → NEEDS_REVIEW VERSION_CHANGE_IN_PERIOD, no amount.
name: version change inside a period
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  stacking: stackable
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
agreements:
  - id: A1
    supplier: S1
    versions:
      - {version_no: 1, effective_to: 2026-02-15, components: [{id: base, type: flat_percent, rate: "0.02"}]}
      - {version_no: 2, effective_from: 2026-02-16, components: [{id: base, type: flat_percent, rate: "0.03"}]}
purchases:
  - {id: L1, supplier: S1, qty: "1", amount: "10000.00", invoice_date: 2026-01-10}
  - {id: L2, supplier: S1, qty: "1", amount: "20000.00", invoice_date: 2026-03-10}
expected:
  - {agreement: A1, period: 2026-01-01..2026-03-31, expected: null, statuses: [NEEDS_REVIEW], reasons: [VERSION_CHANGE_IN_PERIOD]}
