# HAND CALCULATION — tiered_incremental on spend. Bands: [0,100k) 1%, [100k,250k) 2%, [250k,∞) 3%
#   M = S = 300,000.00
#   band 1: 0.01 × (100,000 − 0)        = 1,000.00
#   band 2: 0.02 × (250,000 − 100,000)  = 3,000.00
#   band 3: 0.03 × (300,000 − 250,000)  = 1,500.00
#   E = 5,500.00
name: tiered_incremental on spend
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  stacking: stackable
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
agreements:
  - id: A1
    supplier: S1
    versions:
      - components:
          - id: inc
            type: tiered_incremental
            tiers:
              - {threshold: "0", rate: "0.01"}
              - {threshold: "100000", rate: "0.02"}
              - {threshold: "250000", rate: "0.03"}
purchases:
  - {id: L1, supplier: S1, qty: "1", amount: "300000.00", invoice_date: 2026-02-01}
expected:
  - {agreement: A1, period: 2026-01-01..2026-03-31, expected: "5500.00", statuses: [OK],
     tier_reached: 3}
