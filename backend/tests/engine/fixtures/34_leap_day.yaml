# HAND CALCULATION — SPEC §9 case 49: monthly periods in leap year 2028
#   Feb 2028 = 2028-02-01..2028-02-29: 200 (Feb 28) + 1,000 (Feb 29) = 1,200 → 1% = 12.00
#   Mar 2028: 500 (Mar 1) → 5.00
name: leap day period boundaries
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  stacking: stackable
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
range: {start: 2028-02-01, end: 2028-03-31}
agreements:
  - {id: A1, supplier: S1, versions: [{effective_from: 2028-01-01, period: {type: monthly, fiscal_year_start_month: 1}, components: [{id: base, type: flat_percent, rate: "0.01"}]}]}
purchases:
  - {id: L1, supplier: S1, qty: "1", amount: "200.00", invoice_date: 2028-02-28}
  - {id: L2, supplier: S1, qty: "1", amount: "1000.00", invoice_date: 2028-02-29}
  - {id: L3, supplier: S1, qty: "1", amount: "500.00", invoice_date: 2028-03-01}
expected:
  - {agreement: A1, period: 2028-02-01..2028-02-29, expected: "12.00", statuses: [OK]}
  - {agreement: A1, period: 2028-03-01..2028-03-31, expected: "5.00", statuses: [OK]}
