# HAND CALCULATION — buying-group program (ADR 0017 §3). Group G1 pays on purchases from its
#   members S1 and S2. Tiers (all units): >=100,000 -> 1%; >=200,000 -> 2%. Q1 2026.
#   Member lines: L1 S1 120,000.00 ; L2 S2 90,000.00 ; L4 S1 return -10,000.00
#   L3 is from S3 (not a member): ignored.
#   M = S = 120,000 + 90,000 - 10,000 = 200,000.00 -> tier 2 reached (gte)
#   E = 0.02 x 200,000 = 4,000.00
name: buying-group program reads member suppliers only
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
agreements:
  - id: AG
    supplier: G1
    members: [S1, S2]
    versions: [{stacking: stackable, components: [{id: vol, type: tiered_all_units, tiers: [{threshold: "100000", rate: "0.01"}, {threshold: "200000", rate: "0.02"}]}]}]
purchases:
  - {id: L1, supplier: S1, qty: "1", amount: "120000.00", invoice_date: 2026-01-15}
  - {id: L2, supplier: S2, qty: "1", amount: "90000.00", invoice_date: 2026-02-10}
  - {id: L3, supplier: S3, qty: "1", amount: "50000.00", invoice_date: 2026-02-11}
  - {id: L4, supplier: S1, qty: "-1", amount: "-10000.00", invoice_date: 2026-03-05}
expected:
  - {agreement: AG, period: 2026-01-01..2026-03-31, expected: "4000.00", statuses: [OK],
     S: "200000.00", M: "200000.00", tier_reached: 2, eligible: 3}
