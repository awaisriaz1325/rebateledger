# HAND CALCULATION — rounding happens once, at the end
#   S = 1,012.50 → 0.01 × 1,012.50 = 10.1250
#   A1 half_up   → 10.13 ; A2 half_even → 10.12 (2 is even)
name: half_up vs half_even rounding
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  stacking: stackable
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
agreements:
  - {id: A1, supplier: S1, versions: [{components: [{id: base, type: flat_percent, rate: "0.01"}]}]}
  - {id: A2, supplier: S2, versions: [{rounding_mode: half_even, components: [{id: base, type: flat_percent, rate: "0.01"}]}]}
purchases:
  - {id: L1, supplier: S1, qty: "1", amount: "1012.50", invoice_date: 2026-01-10}
  - {id: L2, supplier: S2, qty: "1", amount: "1012.50", invoice_date: 2026-01-10}
expected:
  - {agreement: A1, period: 2026-01-01..2026-03-31, expected: "10.13", unrounded: "10.1250", statuses: [OK]}
  - {agreement: A2, period: 2026-01-01..2026-03-31, expected: "10.12", unrounded: "10.1250", statuses: [OK]}
