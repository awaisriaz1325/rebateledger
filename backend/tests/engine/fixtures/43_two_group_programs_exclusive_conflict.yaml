# HAND CALCULATION — two programs of the same group G1 (same payer). AG1 is exclusive and
#   covers member S1; AG2 covers S1 and S2. L1 (S1, 10,000.00) is eligible for both and one is
#   exclusive -> both agreement-periods NEEDS_REVIEW STACKING_CONFLICT (same rule as fixture 24).
name: exclusive conflict between programs of the same group
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
agreements:
  - id: AG1
    supplier: G1
    members: [S1]
    versions: [{stacking: exclusive, components: [{id: base, type: flat_percent, rate: "0.01"}]}]
  - id: AG2
    supplier: G1
    members: [S1, S2]
    versions: [{stacking: stackable, components: [{id: base, type: flat_percent, rate: "0.02"}]}]
purchases:
  - {id: L1, supplier: S1, qty: "1", amount: "10000.00", invoice_date: 2026-01-20}
  - {id: L2, supplier: S2, qty: "1", amount: "5000.00", invoice_date: 2026-01-21}
expected:
  - {agreement: AG1, period: 2026-01-01..2026-03-31, expected: null, statuses: [NEEDS_REVIEW], reasons: [STACKING_CONFLICT]}
  - {agreement: AG2, period: 2026-01-01..2026-03-31, expected: null, statuses: [NEEDS_REVIEW], reasons: [STACKING_CONFLICT]}
