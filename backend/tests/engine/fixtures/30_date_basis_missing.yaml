# HAND CALCULATION — SPEC §9 case 15: date_basis = ship_date
#   L1 shipped Feb 1, 1,000 → eligible ; L2 has invoice date only → DATE_BASIS_MISSING
#   E = 0.02 × 1,000 = 20.00
name: basis date missing
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  stacking: stackable
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
agreements:
  - {id: A1, supplier: S1, versions: [{date_basis: ship_date, components: [{id: base, type: flat_percent, rate: "0.02"}]}]}
purchases:
  - {id: L1, supplier: S1, qty: "1", amount: "1000.00", invoice_date: 2026-01-30, ship_date: 2026-02-01}
  - {id: L2, supplier: S1, qty: "1", amount: "500.00", invoice_date: 2026-02-01}
expected:
  - {agreement: A1, period: 2026-01-01..2026-03-31, expected: "20.00", statuses: [OK], excluded: {DATE_BASIS_MISSING: 1}}
