# HAND CALCULATION — same as fixture 09 but threshold_comparison = gt
#   growth = 0.10 ; gt: 0.10 > 0.10 is false → pays 0 → NOT_EARNED
#   A2: M = 219,999.99 with gte → growth 0.09999995 < 0.10 → 0 → NOT_EARNED
name: growth_threshold not met
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  stacking: stackable
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
agreements:
  - id: A1
    supplier: S1
    versions:
      - threshold_comparison: gt
        components: [{id: g, type: growth_threshold, rate: "0.01", growth_pct: "0.10", baseline_source: imported}]
  - id: A2
    supplier: S2
    versions:
      - components: [{id: g, type: growth_threshold, rate: "0.01", growth_pct: "0.10", baseline_source: imported}]
baselines:
  - {agreement: A1, start: 2026-01-01, end: 2026-03-31, value: "200000"}
  - {agreement: A2, start: 2026-01-01, end: 2026-03-31, value: "200000"}
purchases:
  - {id: L1, supplier: S1, qty: "1", amount: "220000.00", invoice_date: 2026-03-01}
  - {id: L2, supplier: S2, qty: "1", amount: "219999.99", invoice_date: 2026-03-01}
expected:
  - {agreement: A1, period: 2026-01-01..2026-03-31, expected: "0.00", statuses: [NOT_EARNED]}
  - {agreement: A2, period: 2026-01-01..2026-03-31, expected: "0.00", statuses: [NOT_EARNED]}
