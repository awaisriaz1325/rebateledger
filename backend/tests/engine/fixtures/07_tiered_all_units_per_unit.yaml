# HAND CALCULATION — tiered_all_units paying per unit
#   A1 (measure quantity): tiers ≥500 → $1.00/unit, ≥1000 → $1.50/unit. Q = M = 800
#       tier 1 → E = 1.00 × 800 = 800.00
#   A2 (measure spend): one tier ≥$10,000 → $2.00/unit. S = M = 12,000, Q = 300
#       tier 1 → E = 2.00 × Q = 2.00 × 300 = 600.00
name: tiered_all_units with per-unit tiers
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  stacking: stackable
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
agreements:
  - id: A1
    supplier: S1
    versions:
      - measure: quantity
        components:
          - id: t
            type: tiered_all_units
            tiers: [{threshold: "500", amount_per_unit: "1.00"}, {threshold: "1000", amount_per_unit: "1.50"}]
  - id: A2
    supplier: S2
    versions:
      - components:
          - {id: t, type: tiered_all_units, tiers: [{threshold: "10000", amount_per_unit: "2.00"}]}
purchases:
  - {id: L1, supplier: S1, qty: "800", amount: "4000.00", invoice_date: 2026-01-20}
  - {id: L2, supplier: S2, qty: "300", amount: "12000.00", invoice_date: 2026-01-20}
expected:
  - {agreement: A1, period: 2026-01-01..2026-03-31, expected: "800.00", statuses: [OK], tier_reached: 1}
  - {agreement: A2, period: 2026-01-01..2026-03-31, expected: "600.00", statuses: [OK], tier_reached: 1}
