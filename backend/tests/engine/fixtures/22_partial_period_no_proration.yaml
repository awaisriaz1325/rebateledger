# HAND CALCULATION — SPEC §9 case 6: agreement starts 2026-02-01 (mid Q1), no proration
#   Window = 2026-02-01..2026-03-31. Jan line (50,000) is outside the window.
#   A1: tier ≥30,000 → 2%. M = 20,000 + 15,000 = 35,000 ≥ 30,000 → 0.02 × 35,000 = 700.00
#   A2: tier ≥40,000 → 2%. M = 35,000 < 40,000 (threshold NOT prorated) → 0.00
name: agreement starts mid-period
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  stacking: stackable
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
agreements:
  - {id: A1, supplier: S1, versions: [{effective_from: 2026-02-01, components: [{id: t, type: tiered_all_units, tiers: [{threshold: "30000", rate: "0.02"}]}]}]}
  - {id: A2, supplier: S2, versions: [{effective_from: 2026-02-01, components: [{id: t, type: tiered_all_units, tiers: [{threshold: "40000", rate: "0.02"}]}]}]}
purchases:
  - {id: L1, supplier: S1, qty: "1", amount: "50000.00", invoice_date: 2026-01-15}
  - {id: L2, supplier: S1, qty: "1", amount: "20000.00", invoice_date: 2026-02-10}
  - {id: L3, supplier: S1, qty: "1", amount: "15000.00", invoice_date: 2026-03-10}
  - {id: L4, supplier: S2, qty: "1", amount: "20000.00", invoice_date: 2026-02-10}
  - {id: L5, supplier: S2, qty: "1", amount: "15000.00", invoice_date: 2026-03-10}
expected:
  - {agreement: A1, period: 2026-02-01..2026-03-31, expected: "700.00", statuses: [OK, PARTIAL_PERIOD]}
  - {agreement: A2, period: 2026-02-01..2026-03-31, expected: "0.00", statuses: [NOT_EARNED, PARTIAL_PERIOD]}
