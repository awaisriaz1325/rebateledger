# HAND CALCULATION — SPEC §9 case 10: 5% × 100,000 = 5,000.00 ; cap 3,000 → 3,000.00, CAPPED
name: cap lower than computed amount
defaults:
  version_no: 1
  effective_from: 2026-01-01
  effective_to: null
  period: {type: quarterly, fiscal_year_start_month: 1}
  date_basis: invoice_date
  measure: spend
  spend_basis: net_of_returns
  threshold_comparison: gte
  negative_result: floor_at_zero
  rounding_mode: half_up
  payment_terms_days: 60
  stacking: stackable
  prorate_thresholds_on_partial_period: false
  zero_baseline_policy: needs_review
range: {start: 2026-01-01, end: 2026-03-31}
agreements:
  - {id: A1, supplier: S1, versions: [{cap_amount: "3000", components: [{id: base, type: flat_percent, rate: "0.05"}]}]}
purchases:
  - {id: L1, supplier: S1, qty: "1", amount: "100000.00", invoice_date: 2026-01-10}
expected:
  - {agreement: A1, period: 2026-01-01..2026-03-31, expected: "3000.00", statuses: [CAPPED, OK]}
