# Local development stack. All ports bind to 127.0.0.1 only.
# Values come from .env (copy .env.example); nothing here is a real secret.
name: rebateledger

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      RL_OWNER_PASSWORD: ${RL_OWNER_PASSWORD:?set RL_OWNER_PASSWORD in .env}
      RL_APP_PASSWORD: ${RL_APP_PASSWORD:?set RL_APP_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5442}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rebateledger"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports: ["127.0.0.1:${REDIS_PORT:-6382}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
