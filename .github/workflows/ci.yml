name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, audit, SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.14
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Start Postgres, Redis, Mailpit (dummy local credentials)
        run: cp .env.example .env && docker compose up -d --wait
      - name: Install dependencies
        run: make setup
      - name: Check suite (lint + types + tests + coverage gates + OpenAPI drift)
        run: make check
      - name: Dependency audit
        run: make audit
      - name: SAST
        run: make sast

  e2e:
    name: Playwright E2E + axe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.14
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cp .env.example .env && docker compose up -d --wait
      - run: make setup
      - run: make migrate
      - run: cd frontend && pnpm exec playwright install --with-deps chromium
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: make secrets
